name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify with Maven
        run: ./mvnw -B verify

  core-contract:
    name: Vendored core contract matches core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the pinned core commit
        id: core
        run: echo "ref=$(cat core-contract/CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout core at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: Tnsor-Labs/brokoli
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - name: Set up core's Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Compare the vendored contract and reference bundles with core
        run: core-contract/check.sh core
